<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PowerSuite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d1838;--bg2:#272049;--ink:#f3f1fa;--soft:#b9b3d3;--line:rgba(255,255,255,.12);--orange:#F07F0F}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Lexend,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:radial-gradient(1200px 700px at 72% 50%,#2e2658 0%,var(--bg) 60%);line-height:1.55;font-size:17px;overflow-x:hidden}
.page{display:grid;grid-template-columns:minmax(380px,1fr) 1.25fr;height:100vh}
aside.intro{padding:32px 24px 32px clamp(32px,4vw,64px);display:flex;flex-direction:column;gap:30px;justify-content:center}
aside.intro img{height:30px;width:auto;align-self:flex-start;opacity:.9}
h1{font-weight:600;font-size:clamp(40px,4.4vw,76px);letter-spacing:-.03em;line-height:1;white-space:nowrap}
.lead{color:var(--soft);font-weight:300;max-width:60ch;margin-top:14px;font-size:clamp(16px,1.15vw,20px)}
.kicker{font-size:clamp(16px,1.15vw,20px);font-weight:400;letter-spacing:0;line-height:1.3;color:var(--soft);margin-bottom:6px}
.hint{margin-top:10px;min-height:2.6em}
.guide{border-top:1px solid var(--line);padding-top:20px}
.guide h2{font-size:clamp(16px,1.1vw,19px);font-weight:500;margin-bottom:16px}
.guide ul{list-style:none;padding:0;display:grid;gap:16px;max-width:70ch}
.guide li{display:grid;grid-template-columns:38px 1fr;gap:14px;font-size:clamp(14px,1vw,17px);color:var(--soft);font-weight:300;line-height:1.45}
.guide li svg{width:38px;height:38px;padding:8px;border-radius:9px;background:rgba(255,255,255,.07);color:var(--orange)}
.guide b{color:var(--ink);font-weight:500}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{font:inherit;font-size:15px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 18px;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.hint{font-size:clamp(14px,.95vw,16px);color:var(--soft);font-weight:300;max-width:70ch}
.stage{position:relative;display:grid;place-items:center;padding:12px;min-height:0}
svg.orbit{width:100%;height:100%;max-height:calc(100vh - 24px);overflow:visible}
.ring{fill:none;stroke:var(--line);stroke-dasharray:2 6}
.spoke{stroke:rgba(255,255,255,.08);transition:stroke .25s}
.node{cursor:pointer;transition:opacity .3s}
.node circle.b{fill:var(--bg2);stroke-width:2.5;transition:r .25s,fill .25s}
.node .ic{color:#fff}
.node text{font:400 15px Lexend,sans-serif;fill:var(--ink)}
.node text.r{font-size:12px;fill:var(--soft);font-weight:300}
.node:hover circle.b,.node:focus-visible circle.b,.node.on circle.b{fill:currentColor}
.node:focus{outline:none}
.node.dim{opacity:.18}
.core text{font:600 22px Lexend,sans-serif;fill:#fff}
.core text.s{font:300 11px Lexend,sans-serif;fill:var(--soft)}
#dotring{transform-origin:400px 400px;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* drawer */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(480px,100%);background:#f7f5fc;color:#24203a;box-shadow:-30px 0 60px rgba(0,0,0,.35);transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);padding:30px 32px;overflow:auto;z-index:5}
.drawer.open{transform:none}
.drawer .top{display:flex;align-items:center;gap:14px}
.drawer .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.drawer .ic svg{width:26px;height:26px}
.drawer h2{font-weight:600;font-size:26px;letter-spacing:-.02em;line-height:1.1}
.drawer .req{font-size:13px;color:#6b6585}
.drawer .close{margin-left:auto;font:inherit;font-size:22px;line-height:1;border:0;background:#e9e5f4;width:36px;height:36px;border-radius:50%;cursor:pointer;color:#24203a}
.drawer img{width:100%;border-radius:10px;margin:22px 0 6px;box-shadow:0 12px 30px -14px rgba(30,20,60,.5);display:block}
.drawer ul{list-style:none;padding:0}
.drawer li{padding:10px 0 10px 18px;border-bottom:1px solid #e5e1ef;font-size:14px;position:relative}
.drawer li::before{content:"";position:absolute;left:0;top:17px;width:7px;height:7px;border-radius:50%;background:var(--c)}
.drawer li strong{font-weight:500}
.drawer .tier{font-size:12.5px;color:#6b6585;margin-top:16px}
@media (max-width:980px){.page{grid-template-columns:1fr;height:auto}aside.intro{padding:28px 24px 0;max-width:none}svg.orbit{max-height:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <aside class="intro">
    <img id="logo" alt="EOS Solutions">
    <div>
      <h1 id="ttl">PowerSuite</h1>
      <p class="lead" id="lead">Benvenuti e benvenute. Questa app raccoglie i report PowerSuite per Business Central: seleziona un modulo per vedere quali report contiene.</p>
    </div>
    <div id="filt">
      <div class="filters" role="group" aria-label="Mostra moduli">
        <button data-f="all" aria-pressed="true">Tutti i moduli</button>
        <button data-f="base" aria-pressed="false">Base</button>
        <button data-f="addon" aria-pressed="false">Add On</button>
      </div>
      <p class="hint" id="hint"></p>
    </div>
    <div class="guide">
      <h2>Come usare i report</h2>
      <ul id="guide"></ul>
    </div>
  </aside>
  <main class="stage">
    <svg class="orbit" viewBox="30 45 740 735" id="orbit" role="group" aria-label="Moduli PowerSuite"></svg>
  </main>
</div>
<div class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="dh" aria-hidden="true"></div>

logo.src = A.logoWhite;
const DOTS=['#F07F0F','#F8B50C','#9CC864','#4EBFA8','#49BFE3','#619ED4','#8571B6'];
const G=[
 ['<circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5M11 8v6M8 11h6"/>','Dettaglio di documento','selezionate un elemento del report e usate il tasto Drill Through.'],
 ['<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>','Filtri temporali','progressivo anno (YTD), mese (MTD), trimestre (QTD), ultimi 6 mesi (HY) e ultimi 12 mesi rolling (MAT).'],
 ['<rect x="2" y="7" width="20" height="10" rx="5"/><circle cx="16" cy="12" r="3"/>','Selettori nella pagina','filtrano per i principali attributi (articolo, cliente); i campi Field Selection personalizzano le tabelle.']];
guide.innerHTML=G.map(([p,t,d])=>`<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg><span><b>${t}</b>: ${d}</span></li>`).join('');

const ONLY = 'base';   /* null = tutti, 'base' o 'addon' = pagina dedicata */
const MODS = ONLY ? PS.modules.filter(m=>m.tier===ONLY) : PS.modules;
if(ONLY){ ttl.innerHTML=`<div class="kicker">PowerSuite</div>${PS.tiers[ONLY].name}`;
  lead.textContent=PS.tiers[ONLY].d+'. Seleziona un modulo per vedere quali report contiene.';
  filt.remove(); document.title='PowerSuite · '+PS.tiers[ONLY].name; }
const C=400, R=ONLY?{base:215,addon:270}:{base:150,addon:290}, NR=ONLY?{base:54,addon:42}:{base:40,addon:32};
let s=[...new Set(MODS.map(m=>m.tier))].map(t=>`<circle class="ring" cx="${C}" cy="${C}" r="${R[t]}"/>`).join('');
const pos={};
['base','addon'].forEach(t=>{
  const ms=MODS.filter(m=>m.tier===t), off=t==='base'?(ONLY?-90:-45):-90;
  ms.forEach((m,i)=>{const a=(off+i*360/ms.length)*Math.PI/180;pos[m.id]=[C+R[t]*Math.cos(a),C+R[t]*Math.sin(a)]});
});
MODS.forEach(m=>{const [x,y]=pos[m.id];s+=`<line class="spoke" id="sp-${m.id}" x1="${C}" y1="${C}" x2="${x}" y2="${y}"/>`});
/* core with EOS dotted ring */
s+=`<g id="dotring">`+[...Array(28)].map((_,i)=>{const a=i/28*2*Math.PI, r=3+3*Math.abs(Math.sin(i/28*Math.PI));
  return `<circle cx="${C+78*Math.cos(a)}" cy="${C+78*Math.sin(a)}" r="${r}" fill="${DOTS[Math.floor(i/4)%7]}"/>`}).join('')+`</g>`;
s+=`<g class="core"><text x="${C}" y="${C+4}" text-anchor="middle">PowerSuite</text><text class="s" x="${C}" y="${C+24}" text-anchor="middle">per Business Central</text></g>`;
MODS.forEach(m=>{const [x,y]=pos[m.id], r=NR[m.tier], k=r/40*26;
  s+=`<g class="node" data-id="${m.id}" data-t="${m.tier}" tabindex="0" role="button" aria-label="${m.name}" style="color:${m.color}">
   <circle class="b" cx="${x}" cy="${y}" r="${r}" stroke="${m.color}"/>
   <svg class="ic" x="${x-k/2}" y="${y-k/2}" width="${k}" height="${k}" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[m.icon]}</svg>
   <text x="${x}" y="${y+r+22}" text-anchor="middle">${m.name}</text>
   ${m.req?`<text class="r" x="${x}" y="${y+r+39}" text-anchor="middle">${m.req}</text>`:''}</g>`});
orbit.innerHTML=s;

const nodes=[...document.querySelectorAll('.node')];
let open=null;
function show(id){
  const m=PS.modules.find(x=>x.id===id); open=id;
  nodes.forEach(n=>n.classList.toggle('on',n.dataset.id===id));
  document.querySelectorAll('.spoke').forEach(l=>l.style.stroke=l.id==='sp-'+id?m.color:'');
  drawer.style.setProperty('--c',m.color);
  drawer.innerHTML=`<div class="top"><span class="ic" style="background:${m.color}">${icon(m.icon)}</span>
    <div><h2 id="dh">${m.name}</h2><div class="req">${m.req?'Ingegnerizzato per '+m.req:'Modulo Base · App Power BI'}</div></div>
    <button class="close" aria-label="Chiudi">×</button></div>
    ${A['shot_'+m.id]?`<img src="${A['shot_'+m.id]}" alt="Anteprima report ${m.name}">`:''}
    ${m.items.length?`<ul>${m.items.map(it=>`<li>${itemHTML(it)}</li>`).join('')}</ul>`:''}
    <p class="tier">${PS.tiers[m.tier].d}.</p>`;
  drawer.classList.add('open'); drawer.setAttribute('aria-hidden','false');
  drawer.querySelector('.close').onclick=hide; drawer.querySelector('.close').focus({preventScroll:true});
}
function hide(){ if(!open)return; const id=open; open=null; drawer.classList.remove('open'); drawer.setAttribute('aria-hidden','true');
  nodes.forEach(n=>n.classList.remove('on')); document.querySelectorAll('.spoke').forEach(l=>l.style.stroke='');
  document.querySelector(`.node[data-id="${id}"]`)?.focus(); }
nodes.forEach(n=>{n.onclick=()=>show(n.dataset.id);
  n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(n.dataset.id)}};
  n.onmouseenter=()=>{if(!open)document.getElementById('sp-'+n.dataset.id).style.stroke=n.style.color};
  n.onmouseleave=()=>{if(!open)document.getElementById('sp-'+n.dataset.id).style.stroke=''}});
addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
document.querySelector('.stage').addEventListener('click',e=>{if(!e.target.closest('.node'))hide()});

function filter(f){if(ONLY)return;document.querySelectorAll('.filters button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===f));
  nodes.forEach(n=>n.classList.toggle('dim',f!=='all'&&n.dataset.t!==f));
  hint.textContent = f==='all'?'Base: le principali aree di business. Add On: soluzioni verticali EOS e funzionalità specifiche di Business Central.':PS.tiers[f].d+'.';}
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filter(b.dataset.f);history.replaceState(null,'','#'+b.dataset.f)});

/* deep link: #base, #addon, #<modulo> */
function fromHash(){const h=location.hash.slice(1);
  if(h==='base'||h==='addon')filter(h);else filter('all');
  if(MODS.some(m=>m.id===h))show(h);}
addEventListener('hashchange',fromHash);fromHash();
</script>
